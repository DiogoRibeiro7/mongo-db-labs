# MongoDB Labs - Root Docker Compose
# This provides a shared MongoDB instance for all labs
version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb-labs
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
      MONGO_INITDB_DATABASE: admin
    volumes:
      # Persistent data storage
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
      # Initialization scripts
      - ./scripts/mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - mongodb-labs-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: >
      mongod
      --auth
      --bind_ip_all
      --setParameter diagnosticDataCollectionEnabled=false

  # Optional: MongoDB Express for GUI access
  mongo-express:
    image: mongo-express:latest
    container_name: mongodb-express-labs
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: adminpassword
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    networks:
      - mongodb-labs-network
    depends_on:
      mongodb:
        condition: service_healthy
    profiles:
      - with-gui

volumes:
  mongodb-data:
    name: mongodb-labs-data
  mongodb-config:
    name: mongodb-labs-config

networks:
  mongodb-labs-network:
    name: mongodb-labs-net
    driver: bridge