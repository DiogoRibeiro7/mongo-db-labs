name: Bug Report
description: Report a bug in a MongoDB teaching lab
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []

body:
  - type: dropdown
    id: lab
    attributes:
      label: Which lab is affected?
      description: Select the lab where you encountered the issue
      options:
        - iot_flood_demo
        - soil_humidity_lorawan
        - ecommerce-orders
        - Other (please specify in description)
    validations:
      required: true

  - type: dropdown
    id: script
    attributes:
      label: Which script has the issue?
      options:
        - 00_setup_mongodb.js
        - 01_seed script
        - 02_simulate script
        - 03_queries_exam.js
        - Helper scripts (new-lab.py, run-lab.py, reset-db.py)
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is
      placeholder: "When I run the seed script, it fails with..."
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error message
      description: Please provide the full error message or traceback
      render: shell
      placeholder: |
        Paste the complete error message here
    validations:
      required: false

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      value: |
        1. Navigate to lab directory
        2. Run command: ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: false

  - type: dropdown
    id: mongodb-version
    attributes:
      label: MongoDB version
      options:
        - "7.0"
        - "6.0"
        - "5.0"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: python-version
    attributes:
      label: Python version
      options:
        - "3.12"
        - "3.11"
        - "3.10"
        - "3.9"
        - "Other"
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Ubuntu/Debian
        - Other Linux
        - Docker
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context about the problem here