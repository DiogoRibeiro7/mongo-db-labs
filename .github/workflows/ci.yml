name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.10'
  MONGODB_VERSION: '7.0'
  MONGOSH_VERSION: 'latest'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install MongoDB Shell
      run: |
        # Install mongosh
        wget -qO - https://www.mongodb.org/static/pgp/server-7.0.asc | sudo apt-key add -
        echo "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu focal/mongodb-org/7.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
        sudo apt-get update
        sudo apt-get install -y mongodb-mongosh

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pymongo
        # Install lab requirements if they exist
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Verify MongoDB connection
      run: |
        mongosh mongodb://localhost:27017 --eval "db.adminCommand('ping')"

    - name: Run unit tests
      run: |
        pytest tests/ -v -m "unit or not slow" --tb=short
      env:
        MONGO_URI: mongodb://localhost:27017

    - name: Run integration tests (fast)
      run: |
        pytest tests/ -v -m "integration and not slow" --tb=short
      env:
        MONGO_URI: mongodb://localhost:27017

    - name: Test IoT Flood Demo lab
      run: |
        # Setup
        mongosh mongodb://localhost:27017 labs/iot_flood_demo/00_setup_mongodb.js

        # Seed
        cd labs/iot_flood_demo
        python 01_seed_flood_project.py --seed 42

        # Quick simulation (1 minute of data)
        python 02_simulate_flood_project.py --hours 0.017 --seed 42 --base-step-sec 60

        # Verify data created
        cd ../..
        mongosh mongodb://localhost:27017/iot_flood_demo --eval "
          const counts = {
            sites: db.sites.countDocuments({}),
            sensors: db.sensors.countDocuments({}),
            measurements: db.measurements.countDocuments({})
          };
          print('Document counts:', JSON.stringify(counts));
          if (counts.sites === 0) throw new Error('No sites created');
          if (counts.sensors === 0) throw new Error('No sensors created');
          if (counts.measurements === 0) throw new Error('No measurements created');
        "
      env:
        MONGO_URI: mongodb://localhost:27017

    - name: Test schema validation
      run: |
        # Test bad inserts script
        mongosh mongodb://localhost:27017 labs/iot_flood_demo/04_bad_inserts.js || true
        # Script should demonstrate validation errors (some inserts will fail as expected)

    - name: Generate test report
      if: always()
      run: |
        echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Python version: ${{ env.PYTHON_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- MongoDB version: ${{ env.MONGODB_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- Tests completed at: $(date)" >> $GITHUB_STEP_SUMMARY

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort

    - name: Check Python formatting with black
      run: |
        black --check --diff labs/ scripts/ tests/ || true

    - name: Check imports with isort
      run: |
        isort --check-only --diff labs/ scripts/ tests/ || true

    - name: Lint with flake8
      run: |
        # Stop on critical errors, but allow style warnings
        flake8 labs/ scripts/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Full lint report (informational)
        flake8 labs/ scripts/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || true

  validate-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Check lab index is up-to-date
      run: |
        python scripts/build_index.py --check
        if [ $? -ne 0 ]; then
          echo "::error::Lab index is outdated. Please run 'python scripts/build_index.py' locally and commit the changes."
          exit 1
        fi

    - name: Validate lab structure
      run: |
        python scripts/lab.py list
        python scripts/lab.py validate iot_flood_demo || true
        python scripts/lab.py validate soil_humidity_lorawan || true

    - name: Check required files
      run: |
        # Check that essential files exist
        for lab in labs/*/; do
          if [ -d "$lab" ]; then
            echo "Checking $lab"
            lab_name=$(basename "$lab")

            # Check for lab.json metadata
            if [ ! -f "$lab/lab.json" ] && [ ! -f "$lab/lab.yml" ]; then
              echo "WARNING: $lab missing lab.json metadata file"
            fi

            # Check for required files
            for file in "00_setup_mongodb.js" "README.md" "DATABASE.md"; do
              if [ ! -f "$lab$file" ]; then
                echo "WARNING: $lab missing $file"
              fi
            done

            # Check for Python seed script
            if ! ls $lab/01_seed*.py 1> /dev/null 2>&1; then
              echo "WARNING: $lab missing seed script"
            fi
          fi
        done

    - name: Validate Docker setup
      run: |
        # Check Docker files exist
        if [ ! -f "docker-compose.yml" ]; then
          echo "ERROR: Root docker-compose.yml missing"
          exit 1
        fi

        echo "Docker setup validated"