name: Release Workflow

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Generate changelog
      id: changelog
      run: |
        # Get the previous tag
        PREV_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")

        if [ -z "$PREV_TAG" ]; then
          echo "No previous tag found, using initial commit"
          PREV_TAG=$(git rev-list --max-parents=0 HEAD)
        fi

        # Generate changelog
        echo "# Changelog" > CHANGELOG.md
        echo "" >> CHANGELOG.md

        # Get commits grouped by type
        echo "## Features" >> CHANGELOG.md
        git log $PREV_TAG..HEAD --grep="^feat:" --pretty="- %s" >> CHANGELOG.md

        echo "" >> CHANGELOG.md
        echo "## Bug Fixes" >> CHANGELOG.md
        git log $PREV_TAG..HEAD --grep="^fix:" --pretty="- %s" >> CHANGELOG.md

        echo "" >> CHANGELOG.md
        echo "## Documentation" >> CHANGELOG.md
        git log $PREV_TAG..HEAD --grep="^docs:" --pretty="- %s" >> CHANGELOG.md

        echo "" >> CHANGELOG.md
        echo "## Other Changes" >> CHANGELOG.md
        git log $PREV_TAG..HEAD --grep="^" --invert-grep --pretty="- %s" | grep -v -E "^- (feat|fix|docs):" >> CHANGELOG.md

        # Count labs
        LAB_COUNT=$(find labs -maxdepth 1 -type d | grep -v "^labs$" | wc -l)
        echo "" >> CHANGELOG.md
        echo "## Statistics" >> CHANGELOG.md
        echo "- Total labs: $LAB_COUNT" >> CHANGELOG.md

    - name: Create lab archive
      run: |
        # Create archives of each lab
        mkdir -p release-artifacts

        for lab in labs/*/; do
          if [ -d "$lab" ]; then
            lab_name=$(basename "$lab")
            echo "Creating archive for $lab_name..."
            tar -czf "release-artifacts/${lab_name}.tar.gz" -C labs "$lab_name"
          fi
        done

        # Create complete archive
        tar -czf "release-artifacts/all-labs.tar.gz" labs/

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "release-artifacts/*"
        bodyFile: "CHANGELOG.md"
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ github.event.inputs.version || github.ref_name }}
        name: "MongoDB Teaching Labs ${{ github.event.inputs.version || github.ref_name }}"
        draft: false
        prerelease: false

  publish-documentation:
    name: Publish Documentation
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install mkdocs mkdocs-material pymdown-extensions

    - name: Generate MkDocs site
      run: |
        # Create mkdocs.yml if it doesn't exist
        if [ ! -f mkdocs.yml ]; then
          cat > mkdocs.yml << EOF
        site_name: MongoDB Teaching Labs
        site_description: Educational MongoDB labs for teaching NoSQL concepts
        repo_url: https://github.com/yourusername/mongo-db-labs
        theme:
          name: material
          features:
            - navigation.sections
            - navigation.expand
            - toc.integrate
        nav:
          - Home: README.md
          - Structure: docs/STRUCTURE.md
          - Contributing: docs/CONTRIBUTING.md
          - Labs:
        EOF
          # Add each lab to navigation
          for lab in labs/*/; do
            if [ -d "$lab" ]; then
              lab_name=$(basename "$lab")
              echo "      - $lab_name: labs/$lab_name/README.md" >> mkdocs.yml
            fi
          done
        fi

        # Build documentation
        mkdocs build

    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v4
      with:
        path: ./site

    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v5