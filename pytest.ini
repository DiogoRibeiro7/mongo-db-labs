[pytest]
# Pytest configuration for MongoDB Labs

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require MongoDB)
    slow: Slow tests (full simulations)
    skip_ci: Skip in CI environment

# Output settings
addopts =
    -ra
    --strict-markers
    --tb=short
    --color=yes

# Timeout
timeout = 60

# Coverage settings (if pytest-cov installed)
# --cov=labs
# --cov=scripts
# --cov-report=term-missing
# --cov-report=html

# Ignore warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# MongoDB connection for tests
env =
    MONGO_URI = mongodb://localhost:27017